name: Build FOSS Debug APK

on:
  push:
    branches:
      - feature/implementacion-plan-maestro-axiom
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble FOSS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ngrok-java JARs
        run: |
          cd vendor/ngrok-java
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q || mvn package -pl ngrok-java -DskipTests -q || true
          mkdir -p ngrok-java-native/target
          if [ -d ngrok-java/target/classes ]; then
            jar cf ngrok-java-native/target/ngrok-java-native-classes.jar -C ngrok-java/target/classes .
          fi

      - name: Compile native libraries for Android
        run: |
          make compile-cloudflared
          make compile-ngrok-native || true

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --stacktrace

      - name: Upload FOSS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fenix-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/app-foss-debug.apk
          retention-days: 7

