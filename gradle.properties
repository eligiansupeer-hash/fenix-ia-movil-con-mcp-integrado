# Project-wide Gradle settings.

# JVM memory allocation tuned for Juana Manso Netbook (3.7 GB RAM, Celeron N4020 2C/2T)
org.gradle.jvmargs=-Xmx1280m -XX:+UseParallelGC -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m -XX:+UseParallelGC

# Build performance: sequential on 2 cores to eliminate CPU trashing and OOM swap death
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Application versioning.
# VERSION_NAME is a fallback used only when git describe is unavailable (e.g. a source
# tarball); normal builds derive the name from git tags. There is intentionally NO
# VERSION_CODE here: the version code is always derived from git history in
# app/build.gradle.kts (getGitVersionCode), never hardcoded.
VERSION_NAME=1.0.0
